[package]
name = "pentaho-content-editor-desktop"
version = "1.11.0"
description = "Desktop shell for the Pentaho Content Editor"
edition = "2021"
rust-version = "1.77"

# The installer already carries a vendored Python runtime and the editor's
# dependency set; keep our own contribution small.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Job objects: the crash-safety net that stops a leaked uvicorn from holding
# the port after we die. See src/server.rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",          # CreateJobObjectW takes SECURITY_ATTRIBUTES
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
